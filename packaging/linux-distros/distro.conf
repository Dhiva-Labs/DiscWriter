# Package metadata for the other-distribution packages (.rpm, Arch, AppImage,
# AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh and packaging/arch/aur.sh. Keep it in step with the .deb
# (packaging/build_deb.sh).

NAME=discwriter
APP_NAME=DiscWriter
GITHUB_REPO=Dhiva-Labs/DiscWriter
TAG_PREFIX=v
SUMMARY='Burn CDs, DVDs and Blu-ray discs on Linux'
DESCRIPTION='Disc Writer is a modern disc burner for the Linux desktop, driving the xorriso command-line tool. It builds data discs with a live capacity gauge and an exact pre-burn size check, appends sessions to open discs, verifies every burn (recorded MD5s for data discs, byte for byte for images), burns and saves ISO images, erases rewritable media and can simulate any job with the laser off.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/DiscWriter
LICENSE=MIT
LICENSE_FILE=LICENSE

# Disc Writer does all of its burning by running xorriso (the .deb's
# Depends). On Arch, xorriso is in the libisoburn package.
RPM_REQUIRES=(/usr/bin/xorriso)
ARCH_DEPENDS=(gtk3 libisoburn)
ARCH_INDEPENDENT=0

# AppImage: it runs the host's xorriso, like the .deb and the tarball.
APPIMAGE=1
EXEC=usr/lib/discwriter/cd_writer
DESKTOP=usr/share/applications/com.dhivalabs.discwriter.desktop
ICON=usr/share/icons/hicolor/256x256/apps/discwriter.png
APPRUN_ENV=''

# Smoke test run in each distribution container by verify.sh: smoke.sh burns
# and verifies a data session on a file-backed drive with xorriso, then
# starts GUI_CMD and passes once the Flutter UI has painted and the app has
# run xorriso (see smoke.sh).
GUI_CMD=discwriter
SMOKE_SECONDS=120
SMOKE_CMD=''
