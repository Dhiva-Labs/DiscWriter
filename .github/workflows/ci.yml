name: CI

# Builds, tests and packages Disc Writer for Linux x64 and Linux arm64: the
# tarball, .deb and snap, and from the same build an .rpm (Fedora, RHEL,
# openSUSE), an Arch package, an AUR PKGBUILD, an AppImage and a Flatpak
# bundle.
#
# Releases are made by hand and carry the tarball, .deb and snap plus
# SHA256SUMS. When a release is published (or this workflow is run by hand
# with release_tag set), the release job attaches every package of every
# architecture built here, x64 and arm64, and skips any file the release
# already has, so hand-made assets win. The checksums of the files it
# adds go into SHA256SUMS. Nothing is ever uploaded to the Snap Store.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release to attach the missing assets to, for example v0.1.0. Leave empty for a plain CI run.'
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: '3.44.6'

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            deb_arch: amd64
            runner: ubuntu-24.04
            elf_machine: x86-64
          - arch: arm64
            deb_arch: arm64
            runner: ubuntu-24.04-arm
            elf_machine: ARM aarch64
    env:
      BUNDLE: build/linux/${{ matrix.arch }}/release/bundle
      ELF_MACHINE: ${{ matrix.elf_machine }}
    steps:
      - uses: actions/checkout@v7

      # xorriso: the burning engine, which the end-to-end tests run for real.
      # xvfb, xauth, dbus-x11: the UI integration test and the smoke run.
      # xdotool, imagemagick: the smoke run finds the window and screenshots it.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorriso clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            git file xvfb xauth xdotool dbus-x11 imagemagick
          command -v xorriso
          xorriso -version 2>&1 | head -n 3

      # There are no SDK archives for linux-arm64, so clone the release tag.
      # The x64 leg does the same to keep one code path.
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Configure Flutter
        run: |
          uname -m
          flutter config --no-analytics --enable-linux-desktop
          flutter precache --linux
          flutter --version
          dart --version

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Unit tests plus the xorriso end-to-end suite (file-backed drives).
      # The end-to-end tests skip themselves when xorriso is missing, so the
      # last line must report no skipped tests ("+N: All tests passed!").
      - name: Test
        run: |
          flutter test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/test.log"
          grep . "$RUNNER_TEMP/test.log" | tail -n 1 | grep -Eq '^[0-9:]+ \+[0-9]+: All tests passed!$'

      # The full UI flow on the real Linux embedder, under a virtual display.
      - name: UI integration test
        run: xvfb-run -a flutter test integration_test -d linux

      - name: Build release
        run: flutter build linux --release

      - name: Assert every ELF file in the bundle is ${{ matrix.elf_machine }}
        run: |
          for f in cd_writer lib/libapp.so lib/libflutter_linux_gtk.so; do
            [ -f "$BUNDLE/$f" ] || { echo "::error::missing $BUNDLE/$f"; exit 1; }
          done
          packaging/assert_arch.sh "$BUNDLE" "$ELF_MACHINE" 4

      - name: Package tarball and .deb
        run: |
          packaging/build_tarball.sh dist
          packaging/build_deb.sh dist

      - name: Check the packages
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          TARBALL="dist/discwriter-${VERSION}-linux-${{ matrix.arch }}.tar.gz"
          DEB="dist/discwriter_${VERSION}_${{ matrix.deb_arch }}.deb"
          ls -l dist
          [ "$(ls dist | wc -l)" -eq 2 ]
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP"
          packaging/assert_arch.sh "$RUNNER_TEMP/discwriter-${VERSION}" "$ELF_MACHINE" 4
          dpkg-deb --info "$DEB"
          [ "$(dpkg-deb --field "$DEB" Architecture)" = "${{ matrix.deb_arch }}" ]
          sudo apt-get install -y "./$DEB"
          packaging/assert_arch.sh /usr/lib/discwriter "$ELF_MACHINE" 4

      # Runs the release (AOT) build that the .deb installed, so this also
      # proves the package's Depends resolve on this architecture. The native
      # GTK runner titles the window "Disc Writer" before any Dart code runs,
      # so the window alone proves nothing. A Flutter UI paints thousands of
      # distinct colours (text, icons, shadows); a runner whose Dart snapshot
      # did not start shows a handful. Count them in a screenshot.
      - name: Smoke-run the installed app (Xvfb)
        timeout-minutes: 5
        run: |
          cat > "$RUNNER_TEMP/smoke.sh" <<'EOF'
          log="$RUNNER_TEMP/smoke.log"
          shot="$RUNNER_TEMP/smoke.png"
          min_colours=200
          HOME="$RUNNER_TEMP/smoke-home" discwriter > "$log" 2>&1 &
          pid=$!
          for i in $(seq 1 90); do
            if xdotool search --name '^Disc Writer$' > /dev/null 2>&1; then
              echo "Disc Writer window is up after ${i}s"
              break
            fi
            kill -0 "$pid" 2> /dev/null || { echo "discwriter exited early"; cat "$log"; exit 1; }
            sleep 1
          done
          colours=0
          for i in $(seq 1 60); do
            kill -0 "$pid" 2> /dev/null || { echo "discwriter died"; cat "$log"; exit 1; }
            import -window root "$shot"
            colours="$(identify -format %k "$shot")"
            echo "screenshot ${i}: $colours distinct colours"
            [ "$colours" -ge "$min_colours" ] && break
            sleep 1
          done
          kill "$pid"
          cat "$log"
          if [ "$colours" -lt "$min_colours" ]; then
            echo "the window never painted a Flutter UI ($colours colours, need $min_colours)"
            exit 1
          fi
          echo "Flutter UI painted: $colours distinct colours"
          EOF
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- bash "$RUNNER_TEMP/smoke.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ matrix.arch }}-screenshot
          path: ${{ runner.temp }}/smoke.png
          if-no-files-found: ignore

  # Repackages each architecture's .deb for Fedora/RHEL/openSUSE (.rpm),
  # Arch (.pkg.tar.zst) and any glibc distribution (AppImage), so every format
  # ships the binary tested above. Each one is then installed on the real
  # distribution and run there (packaging/linux-distros/verify.sh): the
  # package manager must resolve its libraries and xorriso, ldd must find
  # every library, that xorriso must burn and verify a session on a
  # file-backed drive, and smoke.sh must see a painted UI that ran xorriso.
  distros:
    name: Other distros ${{ matrix.arch }}
    needs: [linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, deb_arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, deb_arch: arm64, runner: ubuntu-24.04-arm }
    env:
      NFPM_VERSION: '2.48.0'
      APPIMAGETOOL_VERSION: '1.9.1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.arch }}
          path: deb

      - name: Install nfpm and appimagetool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$(uname -m)" in
            x86_64) nfpm_arch=x86_64; ai_arch=x86_64 ;;
            aarch64) nfpm_arch=arm64; ai_arch=aarch64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          tarball="nfpm_${NFPM_VERSION}_Linux_${nfpm_arch}.tar.gz"
          gh release download "v$NFPM_VERSION" -R goreleaser/nfpm -p "$tarball" -p checksums.txt
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" nfpm
          gh release download "$APPIMAGETOOL_VERSION" -R AppImage/appimagetool \
            -p "appimagetool-$ai_arch.AppImage" -O appimagetool
          chmod +x appimagetool
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build .rpm, Arch package and AppImage
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          dpkg-deb -x "deb/discwriter_${VERSION}_${{ matrix.deb_arch }}.deb" "$RUNNER_TEMP/root"
          VERSION="$VERSION" packaging/linux-distros/pack.sh "$RUNNER_TEMP/root" ${{ matrix.deb_arch }} dist
          # The Flatpak job builds from the same tree; tar keeps modes and symlinks.
          tar -C "$RUNNER_TEMP/root" -cJf "$RUNNER_TEMP/tree.tar.xz" .

      - uses: actions/upload-artifact@v7
        with:
          name: tree-${{ matrix.arch }}
          path: ${{ runner.temp }}/tree.tar.xz
          if-no-files-found: error
          retention-days: 3

      - name: Install and run on Fedora, openSUSE and Arch
        run: packaging/linux-distros/verify.sh dist ${{ matrix.deb_arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: distros-${{ matrix.arch }}
          path: |
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
          if-no-files-found: error

  # AUR recipe: PKGBUILD + .SRCINFO for discwriter-bin, rendered with the
  # checksums of the .debs built above and proven with makepkg and an
  # install on archlinux:latest. Pushing it to the AUR is a manual step.
  aur:
    name: AUR PKGBUILD
    needs: [linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: 'linux-*'
          path: debs
          merge-multiple: true

      - name: Render and check the PKGBUILD
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          VERSION="$VERSION" packaging/arch/aur.sh \
            "debs/discwriter_${VERSION}_amd64.deb" "debs/discwriter_${VERSION}_arm64.deb" dist

      - uses: actions/upload-artifact@v7
        with:
          name: aur
          path: dist/*-aur.tar.gz
          if-no-files-found: error

  # The Flatpak, built from the same installed tree. The GNOME runtime has no
  # xorriso, so the manifest builds GNU xorriso into the bundle; the app finds
  # it on PATH. The bundle is then installed in the builder image and checked
  # inside the sandbox: every library resolves, the app gets that xorriso,
  # xorriso burns and verifies a session on a file-backed drive, and the
  # sandboxed app paints its UI and runs xorriso (smoke.sh). There is no
  # optical drive on the runners, so real drive access is not exercised.
  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: [distros]
    # It only needs the tree, which distros uploads before its distribution
    # checks, so a Flatpak problem shows in the same run as a failed check.
    if: ${{ !cancelled() && needs.distros.result != 'skipped' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, fp_arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, fp_arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      APP_ID: com.dhivalabs.discwriter
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: tree-${{ matrix.arch }}
          path: ${{ runner.temp }}

      - name: Unpack the installed tree
        id: v
        run: |
          mkdir -p packaging/flatpak/tree
          tar -xJf "$RUNNER_TEMP/tree.tar.xz" -C packaging/flatpak/tree
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "bundle=discwriter-$VERSION-${{ matrix.fp_arch }}.flatpak" >> "$GITHUB_OUTPUT"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.dhivalabs.discwriter.yml
          bundle: ${{ steps.v.outputs.bundle }}
          arch: ${{ matrix.fp_arch }}
          cache: false
          artifact-name: flatpak-${{ matrix.arch }}

      - name: Install the bundle and check it inside the sandbox
        env:
          BUNDLE: ${{ steps.v.outputs.bundle }}
        run: |
          flatpak install --user -y --noninteractive "$BUNDLE"
          flatpak info --user --show-permissions "$APP_ID"
          flatpak run --command=sh "$APP_ID" -s < packaging/flatpak/ldd-check.sh
          # Xorriso.locate() takes the first xorriso on PATH: the bundled one.
          flatpak run --command=sh "$APP_ID" -c '
            set -eu
            [ "$(command -v xorriso)" = /app/bin/xorriso ]
            xorriso -version
          '

      - name: Run the sandboxed app (Xvfb)
        timeout-minutes: 5
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime" SMOKE_FB="$RUNNER_TEMP/fb"
          mkdir -p -m 0700 "$XDG_RUNTIME_DIR"
          mkdir -p "$SMOKE_FB"
          # The job runs as root, but $HOME is the runner user's bind mount
          # and the sandbox drops root's capabilities, so nothing inside it
          # could write the ISO or the shim's log there. Own it first.
          chown "$(id -u):$(id -g)" "$HOME"
          # smoke.sh burns with the sandbox's xorriso, and its shim (in
          # $HOME, which the sandbox sees) wraps that same binary.
          export XORRISO=/app/bin/xorriso XORRISO_CMD="flatpak run --command=xorriso $APP_ID"
          xvfb-run -a -s "-screen 0 1280x800x24 -fbdir $SMOKE_FB" \
            dbus-run-session -- bash packaging/linux-distros/smoke.sh \
            flatpak run --env=PATH="$HOME/xorriso-shim:/app/bin:/usr/bin" "$APP_ID"

  # The snap is built from the same sources by snapcraft in an LXD container,
  # with xorriso staged inside it. It is a workflow artifact only: nothing is
  # uploaded to the Snap Store.
  snap:
    name: Snap ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            elf_machine: x86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            elf_machine: ARM aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: snapcore/action-build@v1
        id: build

      - name: Assert the snap is ${{ matrix.arch }}
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
          ELF_MACHINE: ${{ matrix.elf_machine }}
        run: |
          ls -l "$SNAP_FILE"
          case "$SNAP_FILE" in
            *_${{ matrix.arch }}.snap) ;;
            *) echo "::error::unexpected snap file name $SNAP_FILE"; exit 1 ;;
          esac
          command -v unsquashfs > /dev/null || sudo apt-get install -y squashfs-tools
          unsquashfs -q -d "$RUNNER_TEMP/snap" "$SNAP_FILE"
          sed -n '/^architectures:/,/^[a-z]/p' "$RUNNER_TEMP/snap/meta/snap.yaml"
          grep -qx -- '- ${{ matrix.arch }}' "$RUNNER_TEMP/snap/meta/snap.yaml"
          [ -f "$RUNNER_TEMP/snap/cd_writer" ]
          [ -f "$RUNNER_TEMP/snap/usr/bin/xorriso" ]
          packaging/assert_arch.sh "$RUNNER_TEMP/snap" "$ELF_MACHINE" 20

      - uses: actions/upload-artifact@v7
        with:
          name: snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

  # Runs on every event so asset selection and the checksum merge are tested
  # on pull requests. Only the upload step is gated, and this is the only job
  # that can write.
  release:
    name: Release assets
    needs: [linux, snap, distros, aur, flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: pubspec.yaml
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          pattern: 'linux-*'
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: 'snap-*'
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: 'distros-*'
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: aur
          path: assets

      - uses: actions/download-artifact@v8
        with:
          pattern: 'flatpak-*'
          path: assets
          merge-multiple: true

      - name: Select the release assets
        id: select
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          NAMES="discwriter-bin-${VERSION}-aur.tar.gz"
          for a in x64 arm64; do NAMES="$NAMES discwriter-${VERSION}-linux-${a}.tar.gz"; done
          for a in amd64 arm64; do NAMES="$NAMES discwriter_${VERSION}_${a}.deb discwriter_${VERSION}_${a}.snap"; done
          for a in x86_64 aarch64; do
            NAMES="$NAMES discwriter-${VERSION}-1.${a}.rpm discwriter-${VERSION}-1-${a}.pkg.tar.zst"
            NAMES="$NAMES DiscWriter-${VERSION}-${a}.AppImage discwriter-${VERSION}-${a}.flatpak"
          done
          ls -l assets
          [ "$(ls assets | wc -l)" -eq 15 ]
          for n in $NAMES; do ls -l "assets/$n"; done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "names=$NAMES" >> "$GITHUB_OUTPUT"

      # Works out which assets the release lacks and builds the SHA256SUMS
      # that adds their checksums: every line the release has now, then one
      # line per added file. The release is the one being published, or the
      # latest one on other events.
      - name: Plan the upload
        id: plan
        env:
          NAMES: ${{ steps.select.outputs.names }}
        run: |
          target="$TAG"
          if [ -z "$target" ]; then
            target="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName || true)"
          fi
          existing=""
          if [ -n "$target" ]; then
            existing="$(gh release view "$target" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          fi
          missing=""
          for n in $NAMES; do
            if grep -qxF "$n" <<< "$existing"; then
              echo "skip $n: already on ${target:-no release}"
            else
              missing="$missing $n"
            fi
          done
          echo "to upload to ${target:-no release}:${missing:- nothing}"
          mkdir -p sums/current out
          : > sums/kept
          if grep -qxF SHA256SUMS <<< "$existing"; then
            gh release download "$target" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir sums/current
            awk 1 sums/current/SHA256SUMS > sums/kept
          fi
          (cd assets && for n in $missing; do sha256sum "$n"; done) > sums/new
          cat sums/kept sums/new > out/SHA256SUMS
          echo "--- SHA256SUMS after the upload"
          cat out/SHA256SUMS
          echo "missing=${missing# }" >> "$GITHUB_OUTPUT"

      - name: Upload to release ${{ github.event.release.tag_name || inputs.release_tag }}
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          VERSION: ${{ steps.select.outputs.version }}
          MISSING: ${{ steps.plan.outputs.missing }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::release tag $TAG does not match pubspec.yaml version $VERSION"
            exit 1
          fi
          if [ -z "$MISSING" ]; then
            echo "the release already has every asset"
            exit 0
          fi
          files=()
          for n in $MISSING; do files+=("assets/$n"); done
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY"
          # SHA256SUMS is replaced by the merged file, which keeps every line
          # it had. It is the one file this job overwrites.
          gh release upload "$TAG" out/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
