name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev xvfb
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Unit tests plus the xorriso end-to-end suite (file-backed drives).
      - run: flutter test
      # The full UI flow on the real Linux embedder, under a virtual display.
      - name: UI integration test
        run: xvfb-run -a flutter test integration_test -d linux
      - name: Release build
        run: flutter build linux --release
